<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeffrey Zhuang - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav>
            <div class="nav-left">
                <h1><a href="#intro" style="color:inherit;text-decoration:none;font:inherit;">Jeffrey Zhuang</a></h1>
                <div class="header-links">
                    <a href="https://docs.google.com/document/d/1zFgNPcJynfORQ27HFbYnqj_kx93CFN513Nw3XoEbEEE/edit?usp=sharing" target="_blank">Resume</a>
                    <a href="https://www.linkedin.com/in/jeffreyzhuang/" target="_blank">LinkedIn</a>
                </div>
            </div>
            <button class="hamburger" aria-label="Toggle menu">☰</button>
            <ul class="nav-right">
                <li><a href="#radar">Radar</a></li>
                <li><a href="#missile">Missile</a></li>
                <li><a href="#plane">Airplane</a></li>
                <li><a href="#lander">Lander</a></li>
                <li><a href="#cansat">CanSat</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section id="intro">
            <div class="intro-content">
                <div class="intro-images">
                    <figure>
                        <img src="images/cleanroom.jpg" alt="Jeffrey in satellite cleanroom">
                        <figcaption>Satellite integration cleanroom</figcaption>
                    </figure>
                    <figure>
                        <img src="images/hawthorne.png" alt="Jeffrey at SpaceX Hawthorne">
                        <figcaption>SpaceX Falcon 9, Hawthorne</figcaption>
                    </figure>
                    <figure>
                        <img src="images/emc.jfif" alt="EMC">
                        <figcaption>Electromagnetic compatibility testing</figcaption>
                    </figure>
                </div>
            </div>
        </section>

        <section id="radar">
            <h2>Pulse Compression Radar</h2>
            <div class="media-grid">
                <img src="images/radar-real.png" alt="Radar">
                <img src="images/antenna-real.png" alt="Antenna">
                <img src="images/hfss.png" alt="HFSS Simulation">
                <img src="images/divider-real.png" alt="Radar Divider">
                <img src="images/radar-mainboard.png" alt="Radar Mainboard">
                <img src="images/duplexer-real.png" alt="Duplexer">
                <img src="images/radar-schematic.png" alt="Radar Schematic">
                <img src="images/link-budget.png" alt="Link Budget">
                <img src="images/radar-highlevel.png" alt="Radar Architecture">
            </div>
        </section>

        <section id="missile">
            <h2>Micro 33mm Precision-Guided Missile</h2>
            <div class="media-grid">
                    <img src="images/missile-assembled.png" alt="Missile assembled">
                    <img src="images/guided_missile.png" alt="Guided missile">
                    <video autoplay muted loop playsinline>
                        <source src="images/cas_test.mp4" type="video/mp4">
                    </video>
                    <img src="images/camera-pcb.png" alt="Camera PCB">
                    <img src="images/camera-pcb-layout.png" alt="Camera PCB Layout">
                    <img src="images/missile-pcb.png" alt="Missile PCB">
                    <img src="images/missile-pcb-render.png" alt="Missile PCB Render">
                    <video autoplay muted loop playsinline>
                        <source src="images/target-tracking.mp4" type="video/mp4">
                    </video>
                    <img src="images/missile-sim.gif" alt="Missile Simulation">
                </div>
        </section>
        
        <section id="plane">
            <h2>Autonomous Plane</h2>
            <div class="media-grid">
                    <img src="images/uav_cad.png" alt="UAV CAD">
                    <img src="images/xflr5.webp" alt="XFLR5 Analysis">
                    <video autoplay muted loop playsinline>
                        <source src="images/uav_flight.mp4" type="video/mp4">
                    </video>
                    <img src="images/printedplane.webp" alt="Printed Plane">
                    <video autoplay muted loop playsinline>
                        <source src="images/slowtrainer.mp4" type="video/mp4">
                    </video>
                    <img src="images/enclosure.webp" alt="Enclosure">
                    <img src="images/mainboard.webp" alt="Main Board">
                    <img src="images/autopilot_layout.png" alt="Autopilot Layout">
                    <video autoplay muted loop playsinline>
                        <source src="images/hitl.mp4" type="video/mp4">
                    </video>
                </div>
        </section>
        
        <section id="lander">
            <h2>Rocket Landing GNC Testbed</h2>
            <div class="media-grid">
                    <img src="images/hopper.webp" alt="Hopper">
                    <img src="images/hopper_cad.png" alt="Hopper CAD">
                    <img src="images/avionics_stack.webp" alt="Avionics Stack">
                    <img src="images/stack_obc.webp" alt="OBC">
                    <img src="images/stack_eps.webp" alt="EPS">
                    <img src="images/first_pcb.webp" alt="First PCB">
                    <video autoplay muted loop playsinline>
                        <source src="images/vio.mp4" type="video/mp4">
                    </video>
                    <video autoplay muted loop playsinline>
                        <source src="images/sucessive_convex.mp4" type="video/mp4">
                    </video>
                    <img src="images/gfold_poster.png" alt="G-FOLD Poster">
                </div>
        </section>
        
        <section id="cansat">
            <h2>CanSat Design Challenge</h2>
            <div class="media-grid">
                    <video autoplay muted loop playsinline>
                        <source src="images/cansat_onboard_camera.mp4" type="video/mp4">
                    </video>
                    <video autoplay muted loop playsinline>
                        <source src="images/rocket_launch.mp4" type="video/mp4">
                    </video>
                    <img src="images/cansat_complete.jpg" alt="CanSat Complete">
                    <video autoplay muted loop playsinline>
                        <source src="images/cansat_cad.mp4" type="video/mp4">
                    </video>
                    <img src="images/cansat_pcb_photo.png" alt="CanSat PCB Photo">
                    <img src="images/cansat_pcb_render.png" alt="CanSat PCB Render">
                    <img src="images/cansat_pcb_schematic.png" alt="CanSat PCB Schematic">
                    <img src="images/cansat_pcb_layout.png" alt="CanSat PCB Layout">
                    <img src="images/presentation.png" alt="Presentation">
                </div>
        </section>
    </main>
    
<footer>
        <p>&copy; 2026 Jeffrey Zhuang</p>
